        sourceType: if-else
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: ai_enabled-script_prose-false
      source: ai_enabled
      target: script_prose
      sourceHandle: 'false'
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: if-else
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: writer-ai_prose
      source: writer
      target: ai_prose
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: llm
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: ai_prose-merge
      source: ai_prose
      target: merge
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: variable-aggregator
        isInIteration: false
        isInLoop: false
    - id: script_prose-merge
      source: script_prose
      target: merge
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: variable-aggregator
        isInIteration: false
        isInLoop: false
    - id: merge-commit_body
      source: merge
