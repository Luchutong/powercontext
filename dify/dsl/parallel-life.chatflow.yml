      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: variable-aggregator
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: commit_body-commit
      source: commit_body
      target: commit
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: commit-format
      source: commit
      target: format
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: format-answer
      source: format
      target: answer
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
