services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    ports:
      - "127.0.0.1:${SEEKDB_PORT:-2883}:2881"
    environment:
      CPU_COUNT: "2"
      MEMORY_LIMIT: "2G"
      DATAFILE_SIZE: "1G"
      DATAFILE_MAXSIZE: "4G"
      LOG_DISK_SIZE: "2G"
      ROOT_PASSWORD: "${SEEKDB_PASSWORD:-}"
      SEEKDB_DATABASE: "${SEEKDB_DATABASE:-stepfun_edge}"
    volumes:
      - seekdb-data:/var/lib/seekdb
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot $${ROOT_PASSWORD:+-p$$ROOT_PASSWORD} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
volumes:
  seekdb-data:
