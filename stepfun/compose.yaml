services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    mem_limit: 3g
    ports:
      - "127.0.0.1:${SEEKDB_PORT:-2883}:2881"
    environment:
      ROOT_PASSWORD: "${SEEKDB_PASSWORD:-}"
      SEEKDB_DATABASE: "${SEEKDB_DATABASE:-stepfun_edge}"
    volumes:
      - seekdb-data:/var/lib/seekdb
      - ./deployment/seekdb.cnf:/etc/seekdb/seekdb.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/seekdb/.initialized && MYSQL_PWD=\"$$ROOT_PASSWORD\" mysql -h127.0.0.1 -P2881 -uroot --connect-timeout=2 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
volumes:
  seekdb-data:
